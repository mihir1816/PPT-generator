name: teacher-content-gen

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-teacher_content_gen}
      POSTGRES_USER: ${DB_USER:-tcg_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - tcg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tcg_user} -d ${DB_NAME:-teacher_content_gen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6380:6379"
    volumes:
      - tcg_redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.14.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - tcg_qdrantdata:/qdrant/storage
    healthcheck:
      # qdrant's image has no curl/wget; use bash's /dev/tcp to check the port
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tcg_miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    ports:
      - "8100:8000"
    volumes:
      - tcg_vllm_cache:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen3-30B-A3B-AWQ}"
      - "--quantization"
      - "${VLLM_QUANTIZATION:-awq}"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-16384}"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEM_UTIL:-0.90}"
      - "--trust-remote-code"
      - "--dtype"
      - "${VLLM_DTYPE:-half}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8200:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: valkey
      QDRANT_HOST: qdrant
      MINIO_HOST: minio
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - tcg_fastembed_cache:/root/.cache/fastembed
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: valkey
      QDRANT_HOST: qdrant
      MINIO_HOST: minio
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - tcg_fastembed_cache:/root/.cache/fastembed
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 --autoscale=4,1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - app

volumes:
  tcg_pgdata:
  tcg_redisdata:
  tcg_qdrantdata:
  tcg_miniodata:
  tcg_vllm_cache:
  tcg_fastembed_cache:
